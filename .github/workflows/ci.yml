name: CI (informational)

on:
  push:
    branches-ignore:
      - master
      - develop
  pull_request:
    branches:
      - develop
      - master

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tup/ansifilter
        run: |
          sudo apt update
          sudo apt install -y tup ansifilter

      - name: Setup GoogleTest
        uses: Bacondish2023/setup-googletest@v1
        with:
          tag: v1.14.0

      - name: Initialize tup
        run: tup init

      - name: Build the compiler
        run: make

      # -------------------------
      # Tests (allowed to fail)
      # -------------------------

      - name: Run Ch4 tests (expressions)
        id: ch4
        run: make test-exprs
        continue-on-error: true

      - name: Run Invariant tests (expressions)
        id: invar
        run: make test-invar
        continue-on-error: true

      - name: Run AST tests (ast)
        id: ast
        run: make test-ast
        continue-on-error: true

      - name: Run Stmts tests (stmts)
        id: stmts
        run: make test-stmts
        continue-on-error: true

      - name: Run Google Tests
        id: gtest
        run: ./gtest/bin/test
        continue-on-error: true

      # -------------------------
      # Final evaluation
      # -------------------------

      - name: CI summary and final status
        if: always()
        run: |
          echo "================ CI SUMMARY ================"
          echo "  Ch4 tests: ${{ steps.ch4.outcome }}"
          echo "Invar tests: ${{ steps.invar.outcome }}"
          echo "  AST tests: ${{ steps.ast.outcome }}"
          echo "Stmts tests: ${{ steps.stmts.outcome }}"
          echo "Googl tests: ${{ steps.gtest.outcome }}"
          echo "============================================"

          if [ "${{ steps.ch4.outcome }}"   != "success" ] || \
             [ "${{ steps.invar.outcome }}" != "success" ] || \
             [ "${{ steps.ast.outcome }}"   != "success" ] || \
             [ "${{ steps.stmts.outcome }}" != "success" ] || \
             [ "${{ steps.gtest.outcome }}" != "success" ]    \
             ; then
            echo "❌ One or more test stages failed (informational)"
            exit 1
          else
            echo "✅ All test stages passed"
          fi
